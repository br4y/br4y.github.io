<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Build My Routine: Daylight (concept)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="daylight.css">
<style>
body{background:#fff}
#sky{position:relative;min-height:calc(100vh - 42px);display:flex;flex-direction:column;overflow:hidden;transition:color .4s}
#sky::before{content:"";position:absolute;inset:0;background:var(--bg);transition:opacity .4s;z-index:0}
#sky>*{position:relative;z-index:1}
#sky.s0{--bg:linear-gradient(180deg,#8ED3F5,#FBE9CF 70%,#FFD3A8)}
#sky.s1{--bg:linear-gradient(180deg,#A8E2FA,#D9F3FC 60%,#FFF3D6)}
#sky.s2{--bg:linear-gradient(180deg,#7FD0F2,#C5EEFB 55%,#FFF0C4)}
#sky.s3{--bg:linear-gradient(180deg,#FFD9AE,#FFB48A 60%,#FF8F78)}
#sky.s4{--bg:linear-gradient(180deg,#2B2A80,#7A4A9E 60%,#F08A8A);color:#fff}
.arc{max-width:640px;margin:8px auto 0;width:100%;padding-inline:var(--gut)}
.arc svg{width:100%;height:auto;display:block;overflow:visible}
.arc .tr{fill:none;stroke:currentColor;stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round;opacity:.55}
.arc .sn{fill:#FFD98B;stroke:#fff;stroke-width:3;transition:cx .45s,cy .45s}
.count{text-align:center;font-weight:600;font-size:17px;margin-top:4px}
.q{flex:1;display:flex;flex-direction:column;align-items:center;padding:clamp(18px,3vw,36px) var(--gut) 40px;text-align:center}
.q h1{font-size:clamp(40px,6vw,84px);letter-spacing:-.045em;line-height:1;max-width:980px}
.q .hint{margin-top:12px;font-size:20px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;width:min(100%,960px);margin-top:30px}
.opts.w3{max-width:760px;grid-template-columns:1fr}
.o{min-height:76px;border-radius:20px;background:rgba(255,255,255,.72);color:var(--ink);font-size:21px;font-weight:500;padding:14px 20px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:transform .12s}
.o:hover{transform:translateY(-2px)}
.o small{display:block;font-size:17px;font-weight:400;color:var(--ink-2)}
.o[aria-pressed=true]{background:var(--ink);color:#fff}.o[aria-pressed=true] small{color:#D5E2EC}
.o i{flex:none;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px currentColor;display:grid;place-items:center;font-style:normal;font-size:17px;font-weight:700}
.o[aria-pressed=true] i::after{content:"✓"}
.ctl{display:flex;gap:12px;margin-top:26px;justify-content:center;flex-wrap:wrap}
.ctl .bk{background:rgba(255,255,255,.55);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* results */
#res{display:none}
.rh{background:linear-gradient(180deg,#8ED3F5,#FBE9CF 88%,#fff);padding-block:clamp(44px,6vw,80px) clamp(30px,4vw,48px);text-align:center}
.rh h1{font-size:clamp(40px,6vw,84px);letter-spacing:-.05em;line-height:.96}
.rh p{font-size:clamp(20px,1.7vw,23px);margin-top:14px}
.care{max-width:880px;margin:26px auto 0;background:#fff;border-radius:18px;padding:18px 22px;text-align:left;box-shadow:inset 0 0 0 2px var(--ink)}
.lay{display:grid;grid-template-columns:1.6fr 1fr;gap:clamp(20px,3vw,44px);align-items:start;padding-block:32px clamp(64px,8vw,110px)}
.slot{border-radius:var(--r);padding:24px;margin-bottom:12px;display:grid;grid-template-columns:150px 1fr;gap:22px;overflow:hidden}
.slot.a{background:var(--dawn)}.slot.b{background:var(--noon)}.slot.c{background:var(--dusk)}.slot.d{background:var(--dark);color:#fff}
.slot .tm{font-weight:600}
.slot h2{font-size:clamp(34px,3.4vw,46px);margin-top:6px}
.item{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;padding:12px 0;border-top:1px solid rgba(12,35,64,.2)}
.slot.d .item{border-color:rgba(255,255,255,.25)}
.item:first-child{border-top:0;padding-top:0}
.item .p{height:128px;margin:0 auto;}.item .p.j{height:96px}
.item h3{font-size:25px;letter-spacing:-.02em}
.why{display:block;font-size:16px;font-weight:600;margin-top:3px}
.item p{font-size:17px;line-height:1.35;margin-top:4px}
.item b{font-weight:600}
.item button{font-size:16px;text-decoration:underline;text-underline-offset:3px;margin-top:4px;min-height:32px;padding:0}
.sum{position:sticky;top:20px;background:var(--mist);border-radius:var(--r);padding:26px}
.sum h2{font-size:32px;letter-spacing:-.03em}
.ln{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.tot{font-size:30px;font-weight:500;letter-spacing:-.03em;border:0;padding-top:14px}
.sum .btn{width:100%;margin-top:10px}
.sum .sec2{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.sum .note{font-size:16px;color:var(--ink-2);margin-top:12px}
.again{display:block;margin-top:12px;text-align:center;text-decoration:underline;text-underline-offset:3px;width:100%;min-height:44px}
@media (max-width:1040px){.lay{grid-template-columns:1fr}.sum{position:static}}
@media (max-width:640px){
 .slot{grid-template-columns:1fr;gap:12px;padding:20px}
 .item{grid-template-columns:72px 1fr}.item .p{height:102px}.item .p.j{height:74px}.item .pr{grid-column:2}
 .opts{grid-template-columns:1fr}
 .o{min-height:68px}
}
@media print{
 #sky,.sum .btn,.again,.item button{display:none!important}
 #res{display:block!important}.slot{break-inside:avoid;background:#fff!important;color:#000!important;border:1px solid #999}
 .lay{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="bar noprint">Free U.S. shipping on orders over $100</div>

<div id="sky" class="s0">
  <header class="hdr clear" data-hdr></header>
  <div class="arc" aria-hidden="true"><svg viewBox="0 0 560 104"><path class="tr" d="M20 96C130-24 430-24 540 96"/><circle class="sn" id="sn" cx="20" cy="96" r="15"/></svg></div>
  <p class="count" id="cnt" aria-live="polite"></p>
  <section class="q" id="q" aria-live="polite"></section>
</div>

<div id="res">
  <header class="hdr" data-hdr></header>
  <div class="rh"><div class="wrap">
    <h1 id="rt"></h1><p id="rs"></p>
    <div class="care" id="care" hidden><strong>Consult your clinician first.</strong> Please review this routine with your clinician before starting.</div>
  </div></div>
  <div class="wrap lay">
    <div id="tl"></div>
    <aside class="sum" aria-label="Routine summary">
      <h2>Summary</h2>
      <div id="ln" style="margin-top:12px"></div>
      <div class="ln tot"><span>Total</span><span id="tot"></span></div>
      <p class="st" id="one"></p>
      <button class="btn" id="addAll" style="margin-top:12px">Add routine to cart</button>
      <button class="btn sec2" onclick="print()">Print this routine</button>
      <p class="note">Demonstration only. Product matching logic is placeholder and is not a recommendation or medical advice.</p>
      <button class="again" id="redo">Start over</button>
    </aside>
  </div>
</div>

<footer class="foot"><div class="wrap" data-ft></div></footer>

<script src="whats-inside.js"></script>
<script src="daylight.js"></script>
<script>
chrome();
const Q=[
 {id:'goals',m:2,h:'What would you like to focus on?',s:'Select up to two.',o:[['move','Joints and mobility'],['bone','Bones'],['sleep','Sleep'],['gut','Digestion'],['energy','Energy'],['heart','Omega-3s'],['skin','Skin, hair and nails'],['immune','Immune']]},
 {id:'form',h:'Which format do you prefer?',o:[['caps','Capsules and tablets'],['drink','Drinks and powders'],['any','No preference']]},
 {id:'active',h:'How active are you?',o:[['low','Lightly active'],['mid','Moderately active'],['high','Very active','Regular training or sport']]},
 {id:'size',h:'How many products would you like?',o:[['small','Essentials only'],['full','Full routine','Includes a daily foundation']]},
 {id:'care',h:'One final question.',s:'Are you pregnant, nursing, taking medication or under a doctor’s care?',o:[['yes','Yes'],['no','No']]}
];
const A={};let i=0;
const sky=document.getElementById('sky'),q=document.getElementById('q'),cnt=document.getElementById('cnt'),sn=document.getElementById('sn');
function bez(t){const u=1-t,x=u*u*u*20+3*u*u*t*130+3*u*t*t*430+t*t*t*540,y=u*u*u*96+3*u*u*t*-24+3*u*t*t*-24+t*t*t*96;return [x,y]}
function step(){
 const c=Q[i],sel=A[c.id]||[];sky.className='s'+i;
 const [x,y]=bez((i+.5)/Q.length);sn.setAttribute('cx',x);sn.setAttribute('cy',y);
 cnt.textContent=`Question ${i+1} of ${Q.length}`;
 q.innerHTML=`<h1>${c.h}</h1>${c.s?`<p class="hint">${c.s}</p>`:''}<div class="opts ${c.o.length<4?'w3':''}">${c.o.map(o=>`<button class="o" data-v="${o[0]}" aria-pressed="${sel.includes(o[0])}"><span>${o[1]}${o[2]?`<small>${o[2]}</small>`:''}</span>${c.m?'<i></i>':''}</button>`).join('')}</div><div class="ctl">${i?'<button class="btn bk" id="bk">Back</button>':''}${c.m?`<button class="btn" id="nx" ${sel.length?'':'disabled'}>Continue</button>`:''}</div>`;
 document.title=`Question ${i+1}: Build My Routine (concept)`;
}
q.onclick=e=>{
 if(e.target.closest('#bk')){i--;step();return}
 if(e.target.closest('#nx')){next();return}
 const b=e.target.closest('.o');if(!b)return;const c=Q[i],v=b.dataset.v;
 if(c.m){const s=A[c.id]=A[c.id]||[];if(s.includes(v))s.splice(s.indexOf(v),1);else if(s.length<c.m)s.push(v);else{s.shift();s.push(v)}
  [...q.querySelectorAll('.o')].forEach(o=>o.setAttribute('aria-pressed',s.includes(o.dataset.v)));document.getElementById('nx').disabled=!s.length}
 else{A[c.id]=[v];[...q.querySelectorAll('.o')].forEach(o=>o.setAttribute('aria-pressed',o==b));setTimeout(next,160)}
};
function next(){if(i<Q.length-1){i++;step();window.scrollTo(0,0)}else show()}

/* Placeholder product matching for demonstration. */
const PICK={move:{caps:'joint',drink:'jpower'},bone:{caps:'bone',drink:'bone'},sleep:{caps:'rest',drink:'calm'},gut:{caps:'fiber',drink:'repair'},energy:{caps:'total',drink:'green'},heart:{caps:'omega',drink:'omega'},skin:{caps:'skin',drink:'skin'},immune:{caps:'defense',drink:'defense'}};
const WHY={move:'Joints and mobility',bone:'Bones',sleep:'Sleep',gut:'Digestion',energy:'Energy',heart:'Omega-3s',skin:'Skin, hair and nails',immune:'Immune',found:'Daily foundation',train:'Active lifestyle'};
const SL=[['a','Morning','Start strong'],['b','Midday','Stay active'],['c','Evening','Recover'],['d','Night','Rest']];
let R=[];
function build(){
 const f=A.form[0]=='drink'?'drink':'caps',m=new Map();
 A.goals.forEach(g=>m.set(PICK[g][f],WHY[g]));
 if(A.size[0]=='full'&&!m.has('total')&&!m.has('green'))m.set(f=='drink'?'green':'total',WHY.found);
 if(A.active[0]=='high'&&A.goals.some(g=>g=='move'||g=='energy'))m.set('whey',WHY.train);
 R=[...m].map(([k,w])=>({k,w}));
}
function draw(){
 const tl=document.getElementById('tl');
 tl.innerHTML=SL.map(s=>{const it=R.filter(r=>P[r.k].t==s[0]);if(!it.length)return'';return `<section class="slot ${s[0]}"><div><p class="tm">${s[1]}</p><h2>${s[2]}</h2></div><div>${it.map(r=>{const p=P[r.k];return `<div class="item"><div>${mk(r.k)}</div><div><h3>${p.url?`<a href="${p.url}">${p.n}</a>`:p.n}</h3><span class="why">${r.w[0].toUpperCase()+r.w.slice(1)}</span><p>${p.d}</p><button class="wi-open" data-inside="${r.k}" style="margin-right:16px">What’s inside</button>${R.length>1?`<button data-rm="${r.k}">Remove</button>`:''}</div><div class="pr"><b>${money(p.pr)}</b></div></div>`}).join('')}</div></section>`}).join('');
 const one=R.reduce((a,r)=>a+P[r.k].pr,0),sub=one;
 document.getElementById('ln').innerHTML=R.map(r=>`<div class="ln"><span>${P[r.k].n}</span><span>${money(P[r.k].pr)}</span></div>`).join('');
 document.getElementById('tot').textContent=money(sub);
 document.getElementById('one').textContent='One-time purchase prices.';
 document.getElementById('rs').textContent=`${R.length} ${R.length==1?'product':'products'} in this sample routine.`;
}
function show(){
 build();sky.style.display='none';document.getElementById('res').style.display='block';
 document.getElementById('rt').textContent='Your sample routine';
 document.getElementById('care').hidden=A.care[0]!='yes';
 document.title='Your Routine (concept)';draw();window.scrollTo(0,0);
}
document.getElementById('tl').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;R=R.filter(r=>r.k!=b.dataset.rm);draw()};
document.getElementById('addAll').onclick=()=>addToCart(R.length,`${R.length} added to cart`);
document.getElementById('redo').onclick=()=>{Object.keys(A).forEach(k=>delete A[k]);i=0;document.getElementById('res').style.display='none';sky.style.display='';step();window.scrollTo(0,0)};
/* ?sample opens a finished routine so reviewers can skip the questions */
if(location.search.includes('sample')){Object.assign(A,{goals:['move','sleep'],form:['caps'],active:['mid'],size:['full'],care:['no']});show()}else step();
</script>
</body>
</html>
